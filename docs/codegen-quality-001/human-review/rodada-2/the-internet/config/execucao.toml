# GERADO pelo Nekkora Studio. Sem credenciais nem valores: segredos vêm de NK_SECRET_<NOME>.
[runtime]
environment = "benchmark"
allowed_origins = ["https://the-internet.herokuapp.com"]
base_url = "https://the-internet.herokuapp.com/login"
process_name = "area_segura_the_internet"

[timeouts]
action_ms = 8000
navigation_ms = 30000
transaction_ms = 120000

[retry]
max_attempts = 2
initial_backoff_ms = 200
max_backoff_ms = 1000

[batch]
max_transaction_attempts = 1
max_consecutive_technical_failures = 1

[browser]
channel = "chrome"
headless = false
accept_downloads = false

[paths]
selectors = "../selectors.json"
